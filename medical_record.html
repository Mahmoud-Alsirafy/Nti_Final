<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Medical Record</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="webfonts/">

</head>
<body>
        <div class="box">

            <div class="header">
                <div class="header-content">

                    <div class="icon">
                    <i class="fa-solid fa-kit-medical"></i>
                    </div>

                    <div class="header-text">
                    <h2>Add Medical Record</h2>
                    <p>Log details for the recent visit.</p>
                    </div>

                </div>

                <button class="close-btn">
                    <i class="fa-solid fa-xmark"></i>
                </button>

            </div>

            <form method="post">
                <div class="form-group">

                    <div class="form-head">

                        <div class="form-body">
                            <label for="select-pet">Select Patient</label>
                            <!-- <div class="select-box"> -->
                            <select name="Pets" id="select-pet">
                            <option selected disabled>Choose a pet...</option>
                            <option>Pet 1</option>
                            <option>Pet 2</option>
                            <option>Pet 3</option>
                            <option>Pet 4</option>
                            </select>
                            <!-- </div> -->
                        </div>

                        <div class="form-body">
                            <label for="date">Visit Date</label>
                            
                            <input type="date" name="visit_date" class="in-date" id="date">

                        </div>
                    </div>

                        <div class="form-body">
                            <label for="describe">Daignosis / Primary Notes <span class="required">*</span></label>
                            
                            <textarea id="describe" name="describe" placeholder="Enter mail findings and observations..." required></textarea>
                        </div>
                        <div class="form-body">
                            <label for="treat-plan">Treatment Plan</label>
                            
                            <textarea id="treat-plan" name="treat_plan" placeholder="Prescriptions, procedures, or next steps..."></textarea>
                        </div>
                        <div class="form-body">
                                <label class="internal-label" for="notes">
                                <i class="fa-solid fa-lock"></i>
                                Internal Notes (Not shared with client)</label>
                                
                                <textarea id="notes" name="notes" placeholder="Staff-only observations" class="internal-notes"></textarea>
                        </div>
                    </div>

                    <div class="form-footer">
                        <button type="reset" name="cancel" class="btn cancel-btn">Cancel</button>
                        <button type="submit" name="save" class="btn save-btn">
                            <i class="fa-regular fa-floppy-disk"></i>
                            Save Medical Record
                        </button>
                    </div>
            </form>
        </div>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
