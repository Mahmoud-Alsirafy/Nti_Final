<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add New Pet</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/all.min.css">
</head>

<body>

    <!-- Sidebar -->
    <aside class="sidebar">

        <!-- Logo -->
        <div class="logo">
            <div class="logo-icon">
                <i class="fa-solid fa-paw"></i>
            </div>
            <div>
                <h2>PetCare</h2>
                <span>Pet Management</span>
            </div>
        </div>

        <!-- Menu -->
        <nav class="sidebar-menu">

            <a href="#" class="menu-item">
                <span class="menu-icon">
                    <i class="fa-regular fa-chart-bar"></i>
                </span>
                <span>Dashboard</span>
            </a>

            <a href="my_pets.html" class="menu-item active">
                <span class="menu-icon">
                    <i class="fa-solid fa-paw"></i>
                </span>
                <span>My Pets</span>
            </a>

            <a href="adoption_details.html" class="menu-item">
                <span class="menu-icon">
                    <i class="fa-solid fa-shield-cat"></i>
                </span>
                <span>Adoption</span>
            </a>

            <a href="#" class="menu-item">
                <span class="menu-icon">
                    <i class="fa-solid fa-user"></i>
                </span>
                <span>Profile</span>
            </a>

            <a href="account-settings.html" class="menu-item">
                <span class="menu-icon">
                    <i class="fa-solid fa-gears"></i>
                </span>
                <span>Settings</span>
            </a>

            <a href="#" class="menu-item">
                <span class="menu-icon">
                    <i class="fa-solid fa-qrcode"></i>
                </span>
                <span>Regenerate QR Code</span>
            </a>

        </nav>

        <!-- Add Pet -->
        <div class="sidebar-bottom">
            <a href="add_pet.html" class="add-pet-btn">
                <span>+</span>
                Add New Pet
            </a>
        </div>

    </aside>

    <!-- Navbar -->
    <header class="navbar">
        <div class="search-box">
            <span><i class="fa-solid fa-magnifying-glass"></i></span>
            <input type="text" placeholder="Search...">
        </div>
        <div class="navbar-right">
            <button class="nav-icon" aria-label="Notifications">
                <i class="fa-solid fa-bell"></i>
                <span class="notification-dot"></span>
            </button>
            <button class="nav-icon" aria-label="Messages">
                <i class="fa-regular fa-comment-dots"></i>
            </button>
            <a href="account-settings.html" class="nav-profile">
                <div class="profile-avatar">S</div>
                <div class="profile-info">
                    <strong>Salma</strong>
                    <span>Pet Owner</span>
                </div>
                <span class="profile-arrow">⌄</span>
            </a>
        </div>
    </header>

    <main class="main-content">
        <div class="page">

            <a href="my_pets.html" class="back"><i class="fa-solid fa-caret-left"></i> Back to My Pets</a>

            <h1>Add New Pet</h1>

            <p class="subtitle">
                Enter the details for your new furry friend to add them to your PetCare profile.
            </p>

            <!-- Basic Information -->
            <div class="card">

                <h2><i class="fa-solid fa-circle-exclamation"></i> Basic Information</h2>

                <div class="form-content">

                    <div class="image-section">

                        <label for="petFile" class="pet-image">
                            <i class="fa-solid fa-image"></i>
                        </label>

                        <input type="file" id="petFile" accept="image/*" hidden>

                    </div>
                    <button type="button">
                        Choose File
                    </button>

                </div>


                <div class="form">

                    <label>Pet Name</label>
                    <input type="text" placeholder="e.g. Bella">


                    <label>Animal Type</label>
                    <input type="text" placeholder="e.g. Dog">


                    <label>Breed</label>
                    <input type="text" placeholder="e.g. Golden Retriever">


                    <div class="two-inputs">

                        <div>
                            <label>Date of Birth</label>
                            <input type="date">
                        </div>

                        <div>
                            <label>Gender</label>
                            <select>
                                <option>Select gender</option>
                                <option>Male</option>
                                <option>Female</option>
                            </select>
                        </div>

                    </div>


                    <label>Weight (lbs)</label>
                    <input type="number" placeholder="e.g. 30">

                </div>

            </div>

        </div>


        <!-- Health Information -->
        <div class="card">

            <h2><i class="fa-solid fa-briefcase-medical"></i> Health Information</h2>

            <label>Vaccination information & Medical History</label>

            <textarea
                placeholder="List recent Vaccination, ongoing medications, or specific medical conditions..."></textarea>

        </div>


        <!-- Buttons -->
        <div class="buttons">

            <button class="cancel">
                Cancel
            </button>

            <button class="save">
                <i class="fa-regular fa-floppy-disk"></i> Save Pet
            </button>

        </div>

    </main>

</body>

</html>
