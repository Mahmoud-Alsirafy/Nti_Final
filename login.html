<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login to PetCare</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body class="login-page">

    <div class="signup-card">

        <!-- Logo -->
        <div class="logo">

            <i class="fa-solid fa-paw"></i>

        </div>


        <!-- Title -->

        <h1>PetCare</h1>

        <p class="subtitle">SaaS Management</p>


        <!-- Tabs -->

        <div class="tabs">

           <a href="login.php" class="tab"> Login </a>

            <button class="tab active">
                Create an Account
            </button>

        </div>


        <!-- Form -->

        <form>

            <!-- Role -->

            <p class="role-title">
                Select your role
            </p>


            <div class="roles">

                <!-- Pet Owner -->

                <input
                    type="radio"
                    name="role"
                    id="owner"
                    value="owner"
                    checked
                >

                <label for="owner" class="role-card">

                    <i class="fa-solid fa-paw paw-icon"></i>

                    <span>Pet Owner</span>

                </label>


                <!-- Veterinary Clinic -->

                <input
                    type="radio"
                    name="role"
                    id="clinic"
                    value="clinic"
                >

                <label for="clinic" class="role-card">

                    <i class="fa-solid fa-hospital clinic-icon"></i>

                    <span>Veterinary Clinic</span>

                </label>

            </div>


            <!-- Email -->

            <label for="email" class="input-label">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                class="input"
                placeholder="you@example.com"
            >


            <!-- Password -->

            <label for="password" class="input-label">
                Password
            </label>

            <input
                type="password"
                id="password"
                class="input"
                placeholder="••••••••"
            >


            <!-- Sign Up -->

            <button type="submit" class="signup-button">

                Sign Up

                <span>→</span>

            </button>

        </form>


        <!-- Terms -->

        <p class="terms">

            By signing up, you agree to our
            <span>Terms of Service</span>
            and
            <span>Privacy Policy.</span>

        </p>


    </div>

</body>

</html>
